[project]
name = "primitive-db"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Skolkoff", email = "Skolkoff.mart@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
project = "primitive_db.main:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]
